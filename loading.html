<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{if .Failed}}10{{else}}2{{end}}">
<meta name="robots" content="noindex">
<title>Quantixy · {{.Domain}}</title>
<link rel="icon" href="data:,">
<style>
:root{--bg1:#d2d2d2;--bg2:#b8b8b8;--fg:#202020;--muted:#656565;--box:rgba(63,63,63,.1);--line:rgba(84,84,84,.3);--logo:#000}
@media (prefers-color-scheme:dark){:root{--bg1:#1e1e1e;--bg2:#2a2a2a;--fg:#ececec;--muted:#a0a0a0;--box:rgba(255,255,255,.06);--line:rgba(255,255,255,.15);--logo:#ececec}}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);
 background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg1))}
main{text-align:center}
svg{width:120px;height:120px;margin-bottom:1rem;fill:var(--logo)}
h1{font-size:2.5rem;font-weight:500;margin-bottom:2.5rem}
.spin{width:40px;height:40px;margin:0 auto 2rem;border:6px solid var(--line);border-top-color:var(--logo);border-radius:50%;animation:s 1.2s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:4s}}
.info{font-size:.95rem;padding:.5rem 1rem;border:1px solid var(--line);border-radius:8px;background:var(--box);color:var(--muted);word-break:break-all}
.info b{color:var(--fg)}
.hint{margin-top:1rem;font-size:.85rem;color:var(--muted)}
footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted)}
footer a{color:inherit}
</style>
</head>
<body>
<main>
<svg viewBox="0 0 625 625" aria-hidden="true"><g transform="translate(0,625) scale(0.1,-0.1)"><path d="M 750,4516 V 1840 C 3184,350 3181.7097,348.58436 3184,350 l 1414,874 c 0,0 -314.5539,217.5246 -317,216 L 3190,760 1111,2045 v 2280 l 2073,1235 c 9.494,5.6561 2076,-1234 2076,-1234 V 2042 l -320,-216 -1351,926 -339,-228 c -2.8622,-1.925 0,0 413,-284 -477,-310 -469.6913,-314.5195 -477,-310 l -1056,653 v 1173 c 0,0 1044.9283,644.7777 1050,645 575.1873,-360.7107 0,0 1045,-638 l 10,-1218 347,-225 c 6.5546,-4.2501 0,0 8,1658 L 3186,4824 1770,3970 c 1,-1605 0,0 1,-1605 1409,-866 1169.0031,-710.2125 1409,-866 l 824,511 c 0,0 0,-3.4435 885,-611.4435 L 5620,1835 5615,4524 3175.0864,5983.2611 Z"/></g></svg>
<h1>Quantixy</h1>
{{if .Failed}}
<div class="info">Could not start <b>{{.Domain}}</b></div>
<p class="hint">Retrying shortly…</p>
{{else}}
<div class="spin" role="status" aria-label="Loading"></div>
<div class="info">Starting services for <b>{{.Domain}}</b></div>
<p class="hint">This page reloads automatically.</p>
{{end}}
</main>
<footer>Created by <a href="https://lnln.eu" rel="noopener noreferrer">LNLN.eu</a></footer>
</body>
</html>
